# Co-located short-prompt experiment; Vast's template proxy occupies port 8000.
# Start ServeLab on port 9000 and the vLLM backend on port 8001.
base_url = "http://127.0.0.1:9000"
model = "servelab-qwen"
concurrency = [1, 4, 8]
repeats = 3
requests_per_run = 64
warmup_requests = 8
request_timeout = 130.0
max_tokens = 128
temperature = 0.0
stream = true
prompts = [
  "Explain bounded queues in an HTTP service in about 200 words, with an example.",
  "Explain why request deadlines and cancellation matter in about 200 words.",
  "Compare latency and throughput in about 200 words, using a restaurant analogy.",
]
